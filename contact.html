<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <nav>
      <div class="logo">Usen-obong</div>
      <div class="nav-toggle">&#9776;</div> <!-- Hamburger menu icon -->
      <ul>
        <li><a href="home.html">Home</a></li>
        <li><a href="about.html">About</a></li>

        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="contact">
    <h2>Contact Me</h2>
    <div class="contact-container">
      <img src="images/contact-image.avif" alt="Contact Image" class="framed-img">
      <form action="#" method="POST">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Your Name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Your Email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Your Message" required></textarea>

        <button type="submit" class="btn">Send Message</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Usen-obong Etim Isaiah. All rights reserved.</p>
  </footer>
  <script src="scripts/main.js"></script> <!-- Include the JavaScript file -->
</body>
